readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "openai>=1.109.1",
    "beautifulsoup4>=4.14.2",
    "requests>=2.32.5",
    "pypdf>=6.10.2",
    "gradio>=6.14.0","langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "openai-agents>=0.23.1",
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "massive>=2.8.0",
    "python-pptx>=1.0.2",
    "strands-agents[openai]>=1.43.0",
    "uvicorn[standard]>=0.46.0",
    "wikipedia>=1.4.0",
